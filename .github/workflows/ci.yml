name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # verify = unit tests (surefire) + Testcontainers/WireMock integration tests (failsafe).
      # GitHub-hosted Ubuntu runners have Docker, so the *IT tests run here.
      - run: chmod +x mvnw && ./mvnw -B verify

  forecast-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecast-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: forecast-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build        # type-check + production build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, forecast-service, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t saanscheck-backend backend
      - run: docker build -t saanscheck-forecast forecast-service
      - run: docker build -t saanscheck-frontend frontend
