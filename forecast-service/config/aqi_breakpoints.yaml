# Copy of the concentration breakpoints in backend/src/main/resources/aqi.yml (VERIFY against CPCB).
# tests/test_backfill.py fails if the two files ever differ. Units: ug/m3, CO in mg/m3.
# averaging_hours / min_hours: CPCB uses 24-h averages for PM10, PM2.5, NO2, SO2, NH3 and 8-h averages
# for CO and O3 (VERIFY). min_hours is our coverage rule: an average needs at least this many valid hours.
averaging:
  PM25: {hours: 24, min_hours: 16}
  PM10: {hours: 24, min_hours: 16}
  NO2: {hours: 24, min_hours: 16}
  SO2: {hours: 24, min_hours: 16}
  NH3: {hours: 24, min_hours: 16}
  CO: {hours: 8, min_hours: 6}
  O3: {hours: 8, min_hours: 6}
min_pollutants: 3
required_any_of: [PM25, PM10]
breakpoints:
  PM25:
    - {c_low: 0, c_high: 30, i_low: 0, i_high: 50}
    - {c_low: 31, c_high: 60, i_low: 51, i_high: 100}
    - {c_low: 61, c_high: 90, i_low: 101, i_high: 200}
    - {c_low: 91, c_high: 120, i_low: 201, i_high: 300}
    - {c_low: 121, c_high: 250, i_low: 301, i_high: 400}
    - {c_low: 251, c_high: 380, i_low: 401, i_high: 500}
  PM10:
