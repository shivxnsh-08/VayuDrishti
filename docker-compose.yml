# One command starts everything:  docker compose up --build
# Secrets come from .env (copy .env.example). Nothing secret is committed.
# Fixed project name: keeps the existing containers and the saans_check_pgdata volume regardless of folder name.
name: saans_check
services:
  postgres:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: saanscheck
      POSTGRES_USER: saanscheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saanscheck}
    ports: ["127.0.0.1:5432:5432"]   # localhost only; the backend uses the compose network
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saanscheck -d saanscheck"]
      interval: 5s
      retries: 20

  redis:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]   # localhost only (Redis has no password)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  forecast-service:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    build: ./forecast-service
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      MODEL_DIR: /app/models/artifacts
      # Automated ML lifecycle (readiness checks, scheduled training, promotion, monitoring, rollback).
      # Reads station_aqi and writes only ml_training_runs / ml_lifecycle_events / ml_lifecycle_state.
      LIFECYCLE_ENABLED: ${LIFECYCLE_ENABLED:-true}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: saanscheck
      PGUSER: saanscheck
      PGPASSWORD: ${POSTGRES_PASSWORD:-saanscheck}
      # Keep native thread pools small so training fits the container's memory.
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    volumes:
      - ./forecast-service/models/artifacts:/app/models/artifacts
    ports: ["127.0.0.1:8000:8000"]   # internal service, no auth: localhost only

  backend:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    build: ./backend
    stop_grace_period: 45s    # > the backend's 30 s graceful shutdown, so a running ingestion can finish
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      forecast-service: {condition: service_started}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/saanscheck
      DB_USER: saanscheck
      DB_PASSWORD: ${POSTGRES_PASSWORD:-saanscheck}
      REDIS_HOST: redis
      FORECAST_SERVICE_URL: http://forecast-service:8000
      DATA_GOV_API_KEY: ${DATA_GOV_API_KEY:-}
      INGESTION_STATE_FILTER: ${INGESTION_STATE_FILTER:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 characters)}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_REQUIRED: ${ADMIN_REQUIRED:-false}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      API_DOCS_PUBLIC: ${API_DOCS_PUBLIC:-true}
    # localhost only, like every other service: other devices on the network must not reach the API,
    # /actuator/prometheus or /v3/api-docs. The web app (via nginx) and Prometheus use the compose network.
    ports: ["127.0.0.1:8080:8080"]

  frontend:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    build: ./frontend
    depends_on: [backend]
    ports: ["127.0.0.1:5173:80"]   # http://localhost:5173 (same port as the Vite dev server; run one at a time)

  prometheus:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    image: prom/prometheus:v2.55.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [backend]

  grafana:
    restart: unless-stopped   # come back after a crash or Docker/PC restart (not after `docker compose stop`)
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Unset -> Grafana default admin/admin, which Grafana forces you to change at first login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

volumes:
  pgdata:
