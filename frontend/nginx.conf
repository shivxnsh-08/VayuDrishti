server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend on the compose network (same origin for the browser, so no CORS).
    location /api/ {
        # Resolve "backend" through Docker's DNS at request time (cached 10 s), not once at nginx start-up,
        # so a recreated backend container with a new IP is picked up without restarting the frontend.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        # nginx's own error when the backend cannot be reached (stopped, restarting, still starting):
        # answer with a problem document that says so. Errors produced BY the backend pass through unchanged.
        error_page 502 503 @api_unavailable;
        error_page 504 @api_timeout;
    }

    location @api_unavailable {
        default_type application/problem+json;
        add_header Retry-After 10 always;
        return 502 '{"type":"about:blank","title":"Bad Gateway","status":502,"detail":"The VayuDrishti API is not reachable right now (it may be starting or restarting). Retrying automatically."}';
    }

    location @api_timeout {
        default_type application/problem+json;
        return 504 '{"type":"about:blank","title":"Gateway Timeout","status":504,"detail":"The VayuDrishti API did not answer within 30 s. Retrying automatically."}';
    }

    # index.html names the current hashed bundle: never reuse a cached copy without revalidating, or a browser
    # keeps running an old build after a deploy. (add_header here replaces the server-level ones, so repeat them.)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Single-page app: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
